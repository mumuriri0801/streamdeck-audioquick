name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20 # the Node.js version Stream Deck runs the plugin on (manifest "Nodejs")
          cache: npm
      - run: npm ci

      - name: Committed bundle matches src/
        if: runner.os == 'Linux'
        run: |
          npm run build
          git diff --exit-code com.diy.audioquick.sdPlugin/bin/plugin.js

      - name: Validate manifest
        if: runner.os == 'Linux'
        run: npm run validate

      # Windows Server runners ship with the audio services off. The compile test needs the
      # Core Audio API to answer; it does not need any actual audio device.
      - name: Start Windows audio services
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($name in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $name -StartupType Automatic
            Start-Service -Name $name
          }
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table -AutoSize

      - run: npm test
